apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: methodingresses.networking.microendpoints.ovena.io
spec:
  group: networking.microendpoints.ovena.io
  scope: Namespaced
  names:
    plural: methodingresses
    singular: methodingress
    kind: MethodIngress
    shortNames:
      - ming
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                lastReconcileTime:
                  type: string
            spec:
              type: object
              properties:
                ingressRef:
                  type: string
                  minLength: 1
                rules:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [path, method, backend]
                    properties:
                      path:
                        type: string
                        pattern: '^/[A-Za-z0-9/_~.%+-]*$'
                      method:
                        type: string
                        enum:
                          - GET
                          - POST
                          - PUT
                          - DELETE
                          - PATCH
                          - HEAD
                          - OPTIONS
                          - CONNECT
                          - TRACE
                      backend:
                        type: object
                        required: [serviceName, servicePort]
                        properties:
                          serviceName:
                            type: string
                            minLength: 1
                          servicePort:
                            type: integer
                            minimum: 1
                            maximum: 65535
              required:
                - ingressRef
                - rules
